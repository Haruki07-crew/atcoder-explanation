<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>競プロ解説ノート ✦ KYOPRO SPACE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      overflow-x: hidden;
    }
    body {
      background:
        radial-gradient(ellipse at 30% 20%, rgba(80, 30, 140, 0.6) 0%, transparent 55%),
        radial-gradient(ellipse at 70% 80%, rgba(30, 60, 160, 0.55) 0%, transparent 55%),
        radial-gradient(ellipse at 50% 50%, rgba(0, 0, 30, 1) 0%, #000 70%);
      background-attachment: fixed;
    }

    #stars {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .nebula {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 15% 25%, rgba(150, 80, 220, 0.18) 0%, transparent 35%),
        radial-gradient(ellipse at 85% 70%, rgba(80, 130, 220, 0.18) 0%, transparent 35%),
        radial-gradient(ellipse at 60% 95%, rgba(220, 100, 180, 0.10) 0%, transparent 40%);
      z-index: 0;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      padding: 36px 20px 14px;
    }

    h1 {
      font-size: clamp(22px, 4.5vw, 36px);
      font-weight: 700;
      letter-spacing: 0.18em;
      background: linear-gradient(90deg, #a8d8ff 0%, #d4a8ff 50%, #ffaad4 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 18px rgba(170, 200, 255, 0.45));
    }

    .subtitle {
      margin-top: 6px;
      font-size: 12px;
      color: rgba(190, 215, 255, 0.65);
      letter-spacing: 0.25em;
    }

    /* ===== ハンバーガーボタン ===== */
    .menu-btn {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 30;
      width: 46px;
      height: 46px;
      border-radius: 12px;
      border: 1px solid rgba(180, 200, 255, 0.4);
      background: rgba(20, 10, 50, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      padding: 0;
      transition: background 0.25s ease, border-color 0.25s ease;
    }
    .menu-btn:hover {
      background: rgba(50, 30, 100, 0.55);
      border-color: rgba(220, 200, 255, 0.7);
    }
    .menu-btn span {
      display: block;
      width: 22px;
      height: 2px;
      background: linear-gradient(90deg, #c8d8ff, #e0c8ff);
      border-radius: 2px;
      transition: transform 0.3s ease, opacity 0.2s ease;
    }
    .menu-btn.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .menu-btn.open span:nth-child(2) { opacity: 0; }
    .menu-btn.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    /* ===== サイドパネル ===== */
    .menu-panel {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 280px;
      max-width: 80vw;
      background: linear-gradient(180deg, rgba(15, 8, 40, 0.92), rgba(8, 4, 25, 0.92));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-right: 1px solid rgba(180, 200, 255, 0.18);
      transform: translateX(-100%);
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
      z-index: 25;
      padding: 80px 22px 22px;
      overflow-y: auto;
    }
    .menu-panel.open { transform: translateX(0); }

    .menu-panel h2 {
      font-size: 12px;
      letter-spacing: 0.3em;
      color: rgba(190, 215, 255, 0.6);
      margin-bottom: 14px;
      padding-left: 4px;
      font-weight: 500;
    }

    .menu-panel .contest-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .menu-panel button {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(170, 200, 255, 0.3);
      color: #e6efff;
      padding: 12px 16px;
      font-size: 14px;
      letter-spacing: 0.08em;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
      transition: transform 0.2s ease, box-shadow 0.25s ease, background 0.25s ease, border-color 0.25s ease;
      font-family: inherit;
    }
    .menu-panel button:hover {
      background: rgba(170, 200, 255, 0.15);
      border-color: rgba(220, 200, 255, 0.8);
      box-shadow: 0 0 20px rgba(170, 200, 255, 0.45);
      transform: translateX(3px);
    }
    .menu-panel button.active {
      background: linear-gradient(135deg, rgba(160, 100, 255, 0.35), rgba(100, 160, 255, 0.35));
      border-color: rgba(230, 210, 255, 1);
      box-shadow: 0 0 22px rgba(180, 140, 255, 0.6), inset 0 0 12px rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    /* ===== バックドロップ ===== */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 20;
    }
    .backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }

    /* ===== 現在のコンテスト表示 ===== */
    .current-label {
      text-align: center;
      font-size: 13px;
      letter-spacing: 0.2em;
      color: rgba(200, 220, 255, 0.7);
      padding: 2px 20px 18px;
    }
    .current-label strong {
      color: #fff;
      background: linear-gradient(90deg, #a8d8ff, #d4a8ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
      letter-spacing: 0.15em;
    }

    iframe {
      display: block;
      width: 100%;
      height: calc(100vh - 170px);
      min-height: 480px;
      border: none;
      background: #fff;
    }

    footer {
      text-align: center;
      padding: 8px 20px 24px;
      font-size: 11px;
      color: rgba(180, 200, 230, 0.45);
      letter-spacing: 0.15em;
    }

    @media (max-width: 480px) {
      header { padding: 22px 16px 6px; }
      iframe { height: calc(100vh - 150px); }
      .menu-btn { top: 14px; left: 14px; width: 42px; height: 42px; }
    }
  </style>
</head>
<body>

  <canvas id="stars"></canvas>
  <div class="nebula"></div>

  <button id="menuToggle" class="menu-btn" aria-label="メニューを開く" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <aside id="menuPanel" class="menu-panel" aria-hidden="true">
    <h2>SELECT CONTEST</h2>
    <div class="contest-list" id="contestNav">
      <button type="button" data-src="abc456.html" data-label="ABC456" class="active">ABC456</button>
      <button type="button" data-src="abc455.html" data-label="ABC455">ABC455</button>
    </div>
  </aside>

  <div id="backdrop" class="backdrop"></div>

  <main>
    <header>
      <h1>✦ 競プロ解説ノート ✦</h1>
      <p class="subtitle">KYOPRO &middot; EXPLANATION &middot; SPACE</p>
    </header>

    <p class="current-label">表示中: <strong id="currentLabel">ABC456</strong></p>

    <iframe id="frame" src="abc456.html" title="contest"></iframe>

    <footer>
      &mdash; floating somewhere in the universe &mdash;
    </footer>
  </main>

<script>
(function () {
  // ============ 星のキャンバスアニメーション ============
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  addEventListener('resize', resize);

  // 普通の星
  const STAR_COUNT = 240;
  const stars = [];
  for (let i = 0; i < STAR_COUNT; i++) {
    stars.push({
      x: Math.random() * innerWidth,
      y: Math.random() * innerHeight,
      r: Math.random() * 1.3 + 0.25,
      a: Math.random(),
      da: (Math.random() * 0.012) + 0.003,
      vy: Math.random() * 0.06 + 0.015,
      hue: Math.random() < 0.15 ? (Math.random() < 0.5 ? 'b' : 'p') : 'w'
    });
  }

  function starColor(s) {
    const a = Math.max(0, Math.min(1, s.a));
    if (s.hue === 'b') return `rgba(180, 220, 255, ${a})`;
    if (s.hue === 'p') return `rgba(230, 200, 255, ${a})`;
    return `rgba(255, 255, 255, ${a})`;
  }

  // 流れ星
  let shooter = null;
  function maybeSpawnShooter() {
    if (!shooter && Math.random() < 0.004) {
      const angle = (Math.PI / 6) + Math.random() * (Math.PI / 6); // 30〜60度
      const speed = 7 + Math.random() * 4;
      shooter = {
        x: -50,
        y: Math.random() * innerHeight * 0.55,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        len: 90 + Math.random() * 60,
        life: 1
      };
    }
  }

  function drawShooter() {
    if (!shooter) return;
    const sp = Math.hypot(shooter.vx, shooter.vy);
    const ux = shooter.vx / sp;
    const uy = shooter.vy / sp;
    const tx = shooter.x - shooter.len * ux;
    const ty = shooter.y - shooter.len * uy;
    const grd = ctx.createLinearGradient(shooter.x, shooter.y, tx, ty);
    grd.addColorStop(0, `rgba(255, 255, 255, ${shooter.life})`);
    grd.addColorStop(0.4, `rgba(200, 220, 255, ${shooter.life * 0.6})`);
    grd.addColorStop(1, `rgba(200, 220, 255, 0)`);
    ctx.strokeStyle = grd;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(shooter.x, shooter.y);
    ctx.lineTo(tx, ty);
    ctx.stroke();

    shooter.x += shooter.vx;
    shooter.y += shooter.vy;
    shooter.life -= 0.008;
    if (shooter.life <= 0 || shooter.x > innerWidth + 100 || shooter.y > innerHeight + 100) {
      shooter = null;
    }
  }

  function loop() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);

    for (const s of stars) {
      s.a += s.da;
      if (s.a > 1) { s.a = 1; s.da = -s.da; }
      if (s.a < 0) { s.a = 0; s.da = -s.da; }
      s.y += s.vy;
      if (s.y > innerHeight) { s.y = 0; s.x = Math.random() * innerWidth; }

      ctx.beginPath();
      ctx.fillStyle = starColor(s);
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();

      // 一部の星はちょっと光る
      if (s.r > 1.2) {
        ctx.beginPath();
        ctx.fillStyle = `rgba(255, 255, 255, ${s.a * 0.15})`;
        ctx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    maybeSpawnShooter();
    drawShooter();

    requestAnimationFrame(loop);
  }
  loop();

  // ============ メニュー開閉 ============
  const menuBtn = document.getElementById('menuToggle');
  const panel = document.getElementById('menuPanel');
  const backdrop = document.getElementById('backdrop');

  function setMenu(open) {
    menuBtn.classList.toggle('open', open);
    panel.classList.toggle('open', open);
    backdrop.classList.toggle('show', open);
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    panel.setAttribute('aria-hidden', open ? 'false' : 'true');
  }
  menuBtn.addEventListener('click', () => setMenu(!panel.classList.contains('open')));
  backdrop.addEventListener('click', () => setMenu(false));
  addEventListener('keydown', (e) => { if (e.key === 'Escape') setMenu(false); });

  // ============ コンテスト切り替え ============
  const nav = document.getElementById('contestNav');
  const frame = document.getElementById('frame');
  const currentLabel = document.getElementById('currentLabel');

  function selectContest(btn, { closeMenu = true } = {}) {
    if (!btn) return;
    const isSame = btn.classList.contains('active');
    nav.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (!isSame) frame.src = btn.dataset.src;
    if (currentLabel) currentLabel.textContent = btn.dataset.label || btn.textContent;
    const name = btn.dataset.src.replace(/\.html$/, '');
    history.replaceState(null, '', '#' + name);
    if (closeMenu) setMenu(false);
  }

  nav.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-src]');
    if (btn) selectContest(btn);
  });

  // 初期表示: URL の hash があればそれを優先
  const hash = location.hash.replace(/^#/, '');
  if (hash) {
    const target = nav.querySelector(`button[data-src="${hash}.html"]`);
    if (target) selectContest(target, { closeMenu: false });
  }
})();
</script>

</body>
</html>
