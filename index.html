<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>競プロ解説ノート</title>
  <style>
    :root {
      --bg: #f3ece0;
      --bg-soft: #ebe2d0;
      --surface: #fbf6ec;
      --surface-hover: #f1e8d4;
      --border: #d9cfb8;
      --border-strong: #b8a980;
      --text: #3a342c;
      --text-muted: #7a6f5d;
      --accent: #8a6d3b;
      --accent-soft: #ede2c5;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main { position: relative; }

    /* ===== ハンバーガーボタン ===== */
    .menu-btn {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 30;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      padding: 0;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .menu-btn:hover { background: var(--surface-hover); border-color: var(--border-strong); }
    .menu-btn span {
      display: block;
      width: 20px;
      height: 2px;
      background: var(--text);
      border-radius: 2px;
      transition: transform 0.25s ease, opacity 0.2s ease;
    }
    .menu-btn.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .menu-btn.open span:nth-child(2) { opacity: 0; }
    .menu-btn.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    /* ===== ナビボタン (HOME / BACK) ===== */
    .nav-btn {
      position: fixed;
      top: 16px;
      z-index: 30;
      height: 44px;
      padding: 0 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      letter-spacing: 0.12em;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      display: none;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .nav-btn.show { display: inline-flex; }
    .nav-btn:hover { background: var(--surface-hover); border-color: var(--border-strong); }
    #backBtn { right: 130px; }
    #homeBtn { right: 16px; }

    /* ===== サイドパネル ===== */
    .menu-panel {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 300px;
      max-width: 85vw;
      background: var(--surface);
      border-right: 1px solid var(--border);
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      z-index: 25;
      padding: 76px 20px 24px;
      overflow-y: auto;
    }
    .menu-panel.open { transform: translateX(0); }

    .menu-section { margin-bottom: 20px; }
    .menu-section h2 {
      font-size: 11px;
      letter-spacing: 0.24em;
      color: var(--text-muted);
      margin-bottom: 10px;
      padding-left: 2px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .menu-section h2 .all-link {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 11px;
      letter-spacing: 0.14em;
      cursor: pointer;
      padding: 2px 4px;
      font-family: inherit;
    }
    .menu-section h2 .all-link:hover { text-decoration: underline; }
    .menu-section .contest-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .menu-section .empty {
      font-size: 12px;
      color: var(--text-muted);
      padding: 10px 12px;
      border: 1px dashed var(--border);
      border-radius: 8px;
    }
    .menu-panel button.contest-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 12px;
      font-size: 14px;
      letter-spacing: 0.06em;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s ease, border-color 0.15s ease;
      font-family: inherit;
    }
    .menu-panel button.contest-btn:hover {
      background: var(--surface-hover);
      border-color: var(--border-strong);
    }
    .menu-panel button.contest-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--text);
    }
    .menu-panel .home-link {
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 12px;
      font-size: 13px;
      letter-spacing: 0.12em;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 16px;
      font-family: inherit;
      transition: background 0.15s ease;
    }
    .menu-panel .home-link:hover { background: var(--surface-hover); }

    /* ===== バックドロップ ===== */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(40, 30, 15, 0.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 20;
    }
    .backdrop.show { opacity: 1; pointer-events: auto; }

    /* ===== ホーム画面 ===== */
    #homeView {
      min-height: 100vh;
      padding: 80px 24px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero {
      text-align: center;
      margin-bottom: 40px;
      max-width: 720px;
    }
    .hero h1 {
      font-size: clamp(26px, 4.5vw, 38px);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text);
      line-height: 1.3;
    }
    .hero .desc {
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.8;
      color: var(--text-muted);
    }

    /* ===== 検索ボックス ===== */
    .search {
      width: 100%;
      max-width: 520px;
      margin-bottom: 40px;
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .search-input:focus {
      border-color: var(--accent);
      background: #fff;
    }
    .search-input::placeholder { color: var(--text-muted); }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      font-size: 15px;
    }
    .search-results {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      max-height: 280px;
      overflow-y: auto;
      box-shadow: 0 6px 18px rgba(60, 50, 30, 0.08);
      z-index: 5;
      display: none;
    }
    .search-results.show { display: block; }
    .search-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      color: var(--text);
      gap: 10px;
    }
    .search-item:last-child { border-bottom: none; }
    .search-item:hover,
    .search-item.active {
      background: var(--surface-hover);
    }
    .search-item .tag {
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      background: var(--bg-soft);
      padding: 2px 8px;
      border-radius: 999px;
    }
    .search-empty {
      padding: 14px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* ===== カテゴリカード（ホーム） ===== */
    .planets {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
      width: 100%;
      max-width: 820px;
    }
    .planet-card {
      padding: 24px 22px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      text-align: left;
      width: 100%;
      color: inherit;
      font-family: inherit;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }
    .planet-card:hover {
      background: var(--surface-hover);
      border-color: var(--border-strong);
      transform: translateY(-2px);
    }
    .planet-card .cat-label {
      font-size: 11px;
      letter-spacing: 0.24em;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .planet-card h3 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
      color: var(--text);
    }
    .planet-card .cat-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 16px;
    }
    .planet-card .cat-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }
    .planet-card .count {
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--bg-soft);
      border: 1px solid var(--border);
    }
    .planet-card .arrow { font-size: 16px; color: var(--accent); }

    /* ===== カテゴリ一覧画面 ===== */
    #categoryView {
      display: none;
      min-height: 100vh;
      padding: 80px 24px 60px;
      flex-direction: column;
      align-items: center;
    }
    #categoryView.show { display: flex; }

    .cat-header {
      text-align: center;
      margin-bottom: 32px;
      max-width: 720px;
    }
    .cat-header .badge {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.24em;
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text-muted);
      margin-bottom: 12px;
      background: var(--surface);
      font-weight: 600;
    }
    .cat-header h1 {
      font-size: clamp(24px, 4vw, 32px);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text);
    }

    .contest-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      width: 100%;
      max-width: 880px;
    }
    .contest-tile {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 18px 14px;
      font-size: 16px;
      letter-spacing: 0.06em;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      text-align: center;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }
    .contest-tile:hover {
      background: var(--surface-hover);
      border-color: var(--border-strong);
      transform: translateY(-2px);
    }
    .contest-grid .empty-tile {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      padding: 30px 20px;
      border: 1px dashed var(--border);
      border-radius: 10px;
    }

    /* ===== コンテスト表示画面 ===== */
    #contestView {
      display: none;
      flex-direction: column;
      height: 100vh;
      padding-top: 60px;
    }
    #contestView.show { display: flex; }

    .current-label {
      position: fixed;
      top: 26px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      margin: 0;
      padding: 0;
      font-size: 12px;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      pointer-events: none;
      white-space: nowrap;
    }
    .current-label strong {
      color: var(--text);
      font-weight: 700;
      letter-spacing: 0.1em;
    }
    iframe {
      display: block;
      width: 100%;
      flex: 1;
      min-height: 0;
      border: none;
      background: #fff;
    }

    footer {
      flex-shrink: 0;
      text-align: center;
      padding: 6px 20px;
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      background: var(--bg-soft);
      border-top: 1px solid var(--border);
    }

    @media (max-width: 480px) {
      #homeView, #categoryView { padding: 76px 16px 40px; }
      .hero { margin-bottom: 28px; }
      .planets { gap: 12px; }
      .menu-btn, .nav-btn { top: 12px; }
      .menu-btn { left: 12px; width: 40px; height: 40px; }
      #homeBtn { right: 12px; height: 40px; padding: 0 12px; font-size: 12px; }
      #backBtn { right: 112px; height: 40px; padding: 0 12px; font-size: 12px; }
      .current-label { top: 22px; font-size: 11px; }
      #contestView { padding-top: 56px; }
    }
  </style>
</head>
<body>

  <button id="menuToggle" class="menu-btn" aria-label="メニューを開く" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <button id="backBtn" class="nav-btn" type="button" aria-label="一覧に戻る">← BACK</button>
  <button id="homeBtn" class="nav-btn" type="button" aria-label="ホームに戻る">⌂ HOME</button>

  <aside id="menuPanel" class="menu-panel" aria-hidden="true">
    <button type="button" class="home-link" id="menuHomeLink">⌂ HOME</button>
    <div id="menuSections"></div>
  </aside>

  <div id="backdrop" class="backdrop"></div>

  <main>
    <!-- ===== ホーム画面 ===== -->
    <section id="homeView">
      <div class="hero">
        <h1>競プロ解説ノート</h1>
        <p class="desc">
          AtCoder のコンテスト解説をまとめています。<br>
          下のカテゴリから選ぶか、検索でジャンプできます。
        </p>
      </div>

      <div class="search">
        <span class="search-icon">⌕</span>
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="abc456 / arc など検索..."
          autocomplete="off"
          spellcheck="false"
        >
        <div id="searchResults" class="search-results" role="listbox"></div>
      </div>

      <div class="planets" id="planets"></div>
    </section>

    <!-- ===== カテゴリ一覧画面 ===== -->
    <section id="categoryView">
      <div class="cat-header">
        <span class="badge" id="catBadge">CATEGORY</span>
        <h1 id="catTitle">-</h1>
      </div>
      <div class="contest-grid" id="contestGrid"></div>
    </section>

    <!-- ===== コンテスト表示画面 ===== -->
    <section id="contestView">
      <p class="current-label">表示中: <strong id="currentLabel">-</strong></p>
      <iframe id="frame" src="about:blank" title="contest"></iframe>
      <footer>競プロ解説ノート</footer>
    </section>
  </main>

<script>
(function () {
  // ============ コンテストデータ ============
  // 新しい解説を追加するときはここに追記するだけ
  const CATEGORIES = [
    {
      id: 'abc',
      label: 'ABC',
      title: 'AtCoder Beginner Contest',
      contests: [
        { id: 'abc458', label: 'ABC458', src: 'abc458.html' },
        { id: 'abc457', label: 'ABC457', src: 'abc457.html' },
        { id: 'abc456', label: 'ABC456', src: 'abc456.html' },
        { id: 'abc455', label: 'ABC455', src: 'abc455.html' },
      ],
    },
    {
      id: 'arc',
      label: 'ARC',
      title: 'AtCoder Regular Contest',
      contests: [],
    },
  ];

  const categoryById = new Map(CATEGORIES.map(c => [c.id, c]));
  const allContests = new Map();
  for (const cat of CATEGORIES) {
    for (const c of cat.contests) allContests.set(c.id, { ...c, category: cat.id });
  }

  // ============ ホーム画面のレンダリング ============
  const planetsEl = document.getElementById('planets');
  for (const cat of CATEGORIES) {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'planet-card';
    card.dataset.cat = cat.id;
    card.innerHTML = `
      <div class="cat-label">${cat.label}</div>
      <h3>${cat.title}</h3>
      <div class="cat-meta">
        <span class="count">${cat.contests.length} 件</span>
        <span class="arrow">→</span>
      </div>
    `;
    card.addEventListener('click', () => showCategory(cat.id));
    planetsEl.appendChild(card);
  }

  // ============ サイドメニューのレンダリング ============
  const menuSectionsEl = document.getElementById('menuSections');
  for (const cat of CATEGORIES) {
    const section = document.createElement('div');
    section.className = 'menu-section';
    const list = cat.contests.length
      ? `<div class="contest-list">${cat.contests.map(c =>
            `<button type="button" class="contest-btn" data-id="${c.id}">${c.label}</button>`
          ).join('')}</div>`
      : `<div class="empty">Coming Soon</div>`;
    section.innerHTML = `
      <h2>
        <span>${cat.label}</span>
        <button type="button" class="all-link" data-cat="${cat.id}">ALL →</button>
      </h2>
      ${list}
    `;
    menuSectionsEl.appendChild(section);
  }

  // ============ メニュー開閉 ============
  const menuBtn = document.getElementById('menuToggle');
  const panel = document.getElementById('menuPanel');
  const backdrop = document.getElementById('backdrop');

  function setMenu(open) {
    menuBtn.classList.toggle('open', open);
    panel.classList.toggle('open', open);
    backdrop.classList.toggle('show', open);
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    panel.setAttribute('aria-hidden', open ? 'false' : 'true');
  }
  menuBtn.addEventListener('click', () => setMenu(!panel.classList.contains('open')));
  backdrop.addEventListener('click', () => setMenu(false));
  addEventListener('keydown', (e) => { if (e.key === 'Escape') setMenu(false); });

  // ============ 画面切り替え ============
  const homeView = document.getElementById('homeView');
  const categoryView = document.getElementById('categoryView');
  const contestView = document.getElementById('contestView');
  const frame = document.getElementById('frame');
  const currentLabel = document.getElementById('currentLabel');
  const homeBtn = document.getElementById('homeBtn');
  const backBtn = document.getElementById('backBtn');
  const menuHomeLink = document.getElementById('menuHomeLink');
  const catBadge = document.getElementById('catBadge');
  const catTitle = document.getElementById('catTitle');
  const contestGrid = document.getElementById('contestGrid');

  let lastCategoryId = null;

  function hideAll() {
    homeView.style.display = 'none';
    categoryView.classList.remove('show');
    contestView.classList.remove('show');
  }

  function showHome({ updateHash = true } = {}) {
    hideAll();
    homeView.style.display = 'flex';
    homeBtn.classList.remove('show');
    backBtn.classList.remove('show');
    frame.src = 'about:blank';
    document.querySelectorAll('.contest-btn').forEach(b => b.classList.remove('active'));
    if (updateHash) history.replaceState(null, '', location.pathname + location.search);
    setMenu(false);
  }

  function showCategory(catId, { updateHash = true } = {}) {
    const cat = categoryById.get(catId);
    if (!cat) return;
    hideAll();
    categoryView.classList.add('show');
    homeBtn.classList.add('show');
    backBtn.classList.remove('show');
    frame.src = 'about:blank';
    lastCategoryId = catId;

    catBadge.textContent = cat.label;
    catTitle.textContent = cat.title;

    contestGrid.innerHTML = cat.contests.length
      ? cat.contests.map(c =>
          `<button type="button" class="contest-tile" data-id="${c.id}">${c.label}</button>`
        ).join('')
      : `<div class="empty-tile">まだ解説はありません — Coming Soon</div>`;

    document.querySelectorAll('.contest-btn').forEach(b => b.classList.remove('active'));
    if (updateHash) history.replaceState(null, '', '#' + cat.id);
    setMenu(false);
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  }

  function showContest(id, { updateHash = true } = {}) {
    const c = allContests.get(id);
    if (!c) return;
    hideAll();
    contestView.classList.add('show');
    homeBtn.classList.add('show');
    backBtn.classList.add('show');
    lastCategoryId = c.category;

    if (!frame.src.endsWith('/' + c.src) && !frame.src.endsWith(c.src)) frame.src = c.src;
    currentLabel.textContent = c.label;
    document.querySelectorAll('.contest-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.id === id);
    });
    if (updateHash) history.replaceState(null, '', '#' + c.id);
    setMenu(false);
  }

  // カテゴリ画面のタイル
  contestGrid.addEventListener('click', (e) => {
    const btn = e.target.closest('.contest-tile[data-id]');
    if (btn) showContest(btn.dataset.id);
  });

  // サイドメニュー
  menuSectionsEl.addEventListener('click', (e) => {
    const allBtn = e.target.closest('.all-link[data-cat]');
    if (allBtn) { showCategory(allBtn.dataset.cat); return; }
    const btn = e.target.closest('.contest-btn[data-id]');
    if (btn) showContest(btn.dataset.id);
  });

  // ナビボタン
  homeBtn.addEventListener('click', () => showHome());
  backBtn.addEventListener('click', () => {
    if (lastCategoryId) showCategory(lastCategoryId);
    else showHome();
  });
  menuHomeLink.addEventListener('click', () => showHome());

  // ============ 検索機能 ============
  const searchInput = document.getElementById('searchInput');
  const searchResults = document.getElementById('searchResults');

  // 検索対象: 全コンテスト + カテゴリ
  const searchIndex = [
    ...[...allContests.values()].map(c => ({
      kind: 'contest',
      id: c.id,
      label: c.label,
      sub: categoryById.get(c.category).title,
      tag: categoryById.get(c.category).label,
    })),
    ...CATEGORIES.map(cat => ({
      kind: 'category',
      id: cat.id,
      label: cat.title,
      sub: `${cat.contests.length} 件`,
      tag: cat.label,
    })),
  ];

  let activeIndex = -1;
  let currentMatches = [];

  function search(q) {
    const query = q.trim().toLowerCase();
    if (!query) return [];
    return searchIndex
      .filter(item =>
        item.id.toLowerCase().includes(query) ||
        item.label.toLowerCase().includes(query)
      )
      .sort((a, b) => {
        // 完全一致 > id前方一致 > その他
        const aExact = a.id.toLowerCase() === query ? 0 : 1;
        const bExact = b.id.toLowerCase() === query ? 0 : 1;
        if (aExact !== bExact) return aExact - bExact;
        const aStarts = a.id.toLowerCase().startsWith(query) ? 0 : 1;
        const bStarts = b.id.toLowerCase().startsWith(query) ? 0 : 1;
        if (aStarts !== bStarts) return aStarts - bStarts;
        return a.id.localeCompare(b.id);
      })
      .slice(0, 8);
  }

  function renderResults(matches) {
    currentMatches = matches;
    activeIndex = matches.length ? 0 : -1;
    if (!matches.length) {
      searchResults.innerHTML = `<div class="search-empty">該当なし</div>`;
      searchResults.classList.add('show');
      return;
    }
    searchResults.innerHTML = matches.map((m, i) => `
      <div class="search-item${i === 0 ? ' active' : ''}" data-id="${m.id}" data-kind="${m.kind}" role="option">
        <span><strong>${m.label}</strong> <span style="color:var(--text-muted);font-size:12px;margin-left:6px;">${m.sub}</span></span>
        <span class="tag">${m.tag}</span>
      </div>
    `).join('');
    searchResults.classList.add('show');
  }

  function hideResults() {
    searchResults.classList.remove('show');
    activeIndex = -1;
  }

  function navigateMatch(m) {
    if (!m) return;
    searchInput.value = '';
    hideResults();
    if (m.kind === 'contest') showContest(m.id);
    else showCategory(m.id);
  }

  function updateActive() {
    const items = searchResults.querySelectorAll('.search-item');
    items.forEach((el, i) => el.classList.toggle('active', i === activeIndex));
    const el = items[activeIndex];
    if (el) el.scrollIntoView({ block: 'nearest' });
  }

  searchInput.addEventListener('input', () => {
    renderResults(search(searchInput.value));
  });

  searchInput.addEventListener('focus', () => {
    if (searchInput.value.trim()) renderResults(search(searchInput.value));
  });

  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (currentMatches.length) {
        activeIndex = (activeIndex + 1) % currentMatches.length;
        updateActive();
      }
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (currentMatches.length) {
        activeIndex = (activeIndex - 1 + currentMatches.length) % currentMatches.length;
        updateActive();
      }
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (activeIndex >= 0 && currentMatches[activeIndex]) {
        navigateMatch(currentMatches[activeIndex]);
      } else {
        // 完全一致があれば優先
        const q = searchInput.value.trim().toLowerCase();
        const exact = searchIndex.find(m => m.id.toLowerCase() === q);
        if (exact) navigateMatch(exact);
      }
    } else if (e.key === 'Escape') {
      searchInput.value = '';
      hideResults();
      searchInput.blur();
    }
  });

  searchResults.addEventListener('mousedown', (e) => {
    const item = e.target.closest('.search-item[data-id]');
    if (!item) return;
    e.preventDefault();
    const m = currentMatches.find(x => x.id === item.dataset.id && x.kind === item.dataset.kind);
    navigateMatch(m);
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search')) hideResults();
  });

  // 初期表示: URL の hash を解釈
  const hash = location.hash.replace(/^#/, '');
  if (hash && allContests.has(hash)) {
    showContest(hash, { updateHash: false });
  } else if (hash && categoryById.has(hash)) {
    showCategory(hash, { updateHash: false });
  } else {
    showHome({ updateHash: false });
  }
})();
</script>

</body>
</html>
